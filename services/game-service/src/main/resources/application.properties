spring.application.name=game-service

# Most platforms/orchestrators either leave this alone (defaults to 8080,
# matching the Dockerfile's EXPOSE and the k8s Service's targetPort) or
# inject their own PORT env var - support both without code changes.
server.port=${PORT:8080}

# Comma-separated list of origins allowed to call this API/open its
# WebSockets. The frontend always uses an explicit absolute URL for this
# service (see accountsApi.js's pattern), so this matters even in local dev.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5175}
